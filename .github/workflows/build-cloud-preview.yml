name: Build ReMind Cloud APK

on:
  push:
    branches:
      - cloud-build-33
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.7.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install and verify
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci
          npm ci --prefix cloud
          npm install --prefix gateway --no-package-lock
          npm run typecheck
          npm test

      - name: Build signed cloud APK
        env:
          REMIND_ANDROID_VERSION_CODE: "33"
        run: |
          mkdir -p artifacts
          eas build --platform android --profile preview-local --local --non-interactive --output artifacts/ReMind-1.0.2-build33-diagnostics-background-insights.apk

      - name: Verify APK and checksum
        run: |
          unzip -t artifacts/ReMind-1.0.2-build33-diagnostics-background-insights.apk
          cd artifacts
          sha256sum ReMind-1.0.2-build33-diagnostics-background-insights.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReMind-1.0.2-build33-diagnostics-background-insights
          path: |
            artifacts/ReMind-1.0.2-build33-diagnostics-background-insights.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
