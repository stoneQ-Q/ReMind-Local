services:
  postgres:
    cpus: 0.75
    mem_limit: 640m
    pids_limit: 200

  api:
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 100
    init: true

  worker:
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 256
    init: true

  backup:
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
