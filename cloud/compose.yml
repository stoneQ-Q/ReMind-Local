name: remind-cloud

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REMIND_POSTGRES_DB:-remind}
      POSTGRES_USER: ${REMIND_POSTGRES_USER:-remind}
      POSTGRES_PASSWORD: ${REMIND_POSTGRES_PASSWORD:?set REMIND_POSTGRES_PASSWORD in cloud/.env}
    ports:
      - "127.0.0.1:${REMIND_DB_PORT:-5432}:5432"
    volumes:
      - remind-postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
    restart: unless-stopped
    command: ["node", "dist/api.js"]
    environment:
      DATABASE_URL: postgresql://${REMIND_POSTGRES_USER:-remind}:${REMIND_POSTGRES_PASSWORD}@postgres:5432/${REMIND_POSTGRES_DB:-remind}
      PORT: 8790
    ports:
      - "127.0.0.1:8790:8790"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8790/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://${REMIND_POSTGRES_USER:-remind}:${REMIND_POSTGRES_PASSWORD}@postgres:5432/${REMIND_POSTGRES_DB:-remind}
      REMIND_WORKER_POLL_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  remind-postgres-data:
