name: remind-cloud

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REMIND_POSTGRES_DB:-remind}
      POSTGRES_USER: ${REMIND_POSTGRES_USER:-remind}
      POSTGRES_PASSWORD: ${REMIND_POSTGRES_PASSWORD:?set REMIND_POSTGRES_PASSWORD in cloud/.env}
    ports:
      - "127.0.0.1:${REMIND_DB_PORT:-5432}:5432"
    volumes:
      - remind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${REMIND_POSTGRES_USER:-remind}:${REMIND_POSTGRES_PASSWORD}@postgres:5432/${REMIND_POSTGRES_DB:-remind}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    restart: unless-stopped
    command: ["node", "dist/api.js"]
    environment:
      DATABASE_URL: postgresql://${REMIND_POSTGRES_USER:-remind}:${REMIND_POSTGRES_PASSWORD}@postgres:5432/${REMIND_POSTGRES_DB:-remind}
      PORT: 8790
      REMIND_CREDENTIAL_KEY_VERSION: ${REMIND_CREDENTIAL_KEY_VERSION}
      REMIND_CREDENTIAL_KEY_BASE64: ${REMIND_CREDENTIAL_KEY_BASE64}
      REMIND_CREDENTIAL_KEY_RING_JSON: ${REMIND_CREDENTIAL_KEY_RING_JSON:-}
    ports:
      - "127.0.0.1:8790:8790"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8790/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://${REMIND_POSTGRES_USER:-remind}:${REMIND_POSTGRES_PASSWORD}@postgres:5432/${REMIND_POSTGRES_DB:-remind}
      REMIND_WORKER_POLL_MS: 1000
      REMIND_CREDENTIAL_KEY_VERSION: ${REMIND_CREDENTIAL_KEY_VERSION}
      REMIND_CREDENTIAL_KEY_BASE64: ${REMIND_CREDENTIAL_KEY_BASE64}
      REMIND_CREDENTIAL_KEY_RING_JSON: ${REMIND_CREDENTIAL_KEY_RING_JSON:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${REMIND_POSTGRES_DB:-remind}
      PGUSER: ${REMIND_POSTGRES_USER:-remind}
      PGPASSWORD: ${REMIND_POSTGRES_PASSWORD}
      REMIND_BACKUP_INTERVAL_SECONDS: ${REMIND_BACKUP_INTERVAL_SECONDS:-86400}
      REMIND_BACKUP_RETENTION_DAYS: ${REMIND_BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    command: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  remind-postgres-data:
